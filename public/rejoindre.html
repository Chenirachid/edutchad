<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rejoindre EduCheni</title>
<link rel="icon" type="image/svg+xml" href="/educheni-logo.svg" />
<style>
  :root{
    --teal-900:#0B4F52; --teal-700:#0F8B8D; --teal-500:#2EC4C6; --teal-100:#E0F5F5;
    --bg:#F2F7F7; --surface:#FFFFFF; --text:#1F2937; --text-muted:#6B7280; --border:#E5E7EB;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .carte{
    background:var(--surface);border-radius:var(--radius);box-shadow:0 8px 30px rgba(11,79,82,.12);
    padding:40px 36px;max-width:460px;width:100%;
  }
  .logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--teal-500),var(--teal-700));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  h1{font-size:20px;text-align:center;color:var(--teal-900);margin:0 0 8px;}
  p.sous-titre{text-align:center;font-size:13.5px;color:var(--text-muted);margin:0 0 26px;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--teal-900);margin-bottom:5px;}
  .champ{margin-bottom:16px;}
  input, textarea{
    width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;
    font-size:14px;font-family:inherit;color:var(--text);
  }
  textarea{resize:vertical;min-height:80px;}
  button{
    width:100%;padding:12px;border:none;border-radius:8px;background:var(--teal-700);color:#fff;
    font-size:14.5px;font-weight:600;margin-top:6px;
  }
  button:hover{background:var(--teal-900);}
  #message-statut{text-align:center;font-size:13px;margin-top:14px;}
</style>
</head>
<body>

<div class="carte">
  <div class="logo-mark">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4L3 8.5l9 4 9-4L12 4z" fill="white"/><path d="M7 9.8v3.4c0 1.4 2 2.8 5 2.8s5-1.4 5-2.8V9.8" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M20.5 8.5v4" stroke="white" stroke-width="1.4" stroke-linecap="round"/><circle cx="20.5" cy="13.3" r="0.9" fill="white"/></svg>
  </div>
  <h1>Vous dirigez un établissement ?</h1>
  <p class="sous-titre">Laissez-nous vos coordonnées, nous vous recontactons pour mettre en place votre espace EduCheni.</p>

  <form id="rejoindre-form">
    <div class="champ">
      <label>Votre nom</label>
      <input type="text" name="nom" required />
    </div>
    <div class="champ">
      <label>Nom de l'établissement</label>
      <input type="text" name="etablissement" required />
    </div>
    <div class="champ">
      <label>Email ou téléphone</label>
      <input type="text" name="contact" required />
    </div>
    <div class="champ">
      <label>Message (facultatif)</label>
      <textarea name="message" placeholder="Nombre d'élèves, ville, besoins particuliers..."></textarea>
    </div>
    <button type="submit">Envoyer ma demande</button>
  </form>
  <p id="message-statut"></p>
</div>

<script>
document.getElementById('rejoindre-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const statut = document.getElementById('message-statut');
  statut.textContent = 'Envoi en cours…';
  statut.style.color = '#6B7280';
  try{
    const reponse = await fetch(window.location.origin + '/demande-etablissement', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nom: fd.get('nom'), etablissement: fd.get('etablissement'),
        contact: fd.get('contact'), message: fd.get('message'),
      }),
    });
    if(!reponse.ok) throw new Error();
    statut.textContent = 'Merci ! Votre demande a bien été envoyée, nous revenons vers vous rapidement.';
    statut.style.color = '#16A34A';
    e.target.reset();
  }catch(err){
    statut.textContent = "Une erreur s'est produite, merci de réessayer plus tard.";
    statut.style.color = '#EF4444';
  }
});
</script>

</body>
</html>
